global:
  scrape_interval: 5s
scrape_configs:
  - job_name: compliance-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: compliance-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["agent-worker"]
        type: A
        port: 9101
        refresh_interval: 5s
